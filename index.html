<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela Mundial 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f7f7f7;--bg3:#efefef;
  --text:#111;--text2:#555;--text3:#999;
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.20);
  --s-bg:#e8f5e0;--s-t:#2d6a0a;
  --w-bg:#fef3e2;--w-t:#7a4800;
  --i-bg:#e8f1fb;--i-t:#1455a0;
  --d-bg:#fde8e8;--d-t:#9b1c1c;
  --r:10px;--rl:14px;
  --red:#c0392b;--gold:#d4ac0d;--navy:#1a3a6b;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#161616;--bg2:#1e1e1e;--bg3:#282828;
  --text:#f0f0f0;--text2:#aaa;--text3:#666;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.18);
  --s-bg:#173404;--s-t:#a8d572;
  --w-bg:#3d2200;--w-t:#f0b060;
  --i-bg:#042050;--i-t:#90c0f0;
  --d-bg:#3a0f0f;--d-t:#f08080;
}}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg2);min-height:100vh;padding-bottom:80px}

/* ── Layout ── */
.app{max-width:640px;margin:0 auto}
.view{display:none}.view.active{display:block}
.inner{padding:1rem}

/* ── Sticky header ── */
#app-header{position:sticky;top:0;z-index:60;background:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.header-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 1rem;height:54px}
.header-logo{display:flex;align-items:center;gap:8px;flex:1}
.header-logo-ball{font-size:22px;line-height:1}
.header-logo-text{display:flex;flex-direction:column}
.header-logo-text strong{font-size:14px;font-weight:700;color:#fff;line-height:1.2}
.header-logo-text small{font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.5px}
.header-chip{background:rgba(255,255,255,.15);border-radius:20px;padding:4px 10px;font-size:12px;color:#fff;display:flex;align-items:center;gap:5px;white-space:nowrap}
.header-btn{background:rgba(255,255,255,.12);border:none;border-radius:8px;padding:6px 10px;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px}
.header-btn:hover{background:rgba(255,255,255,.22)}

/* ── Sticky footer score ── */
#app-footer{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--bg);border-top:0.5px solid var(--border);padding:8px 1rem;display:none}
.footer-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.footer-pts{font-size:22px;font-weight:700;color:var(--red)}
.footer-label{font-size:11px;color:var(--text2);line-height:1.3}
.footer-rank{margin-left:auto;background:var(--navy);color:#fff;border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600}
.footer-next{flex:1;font-size:11px;color:var(--text2);text-align:right;line-height:1.4}

/* ── Welcome card ── */
.welcome-card{background:linear-gradient(135deg,var(--navy),#2c5fa8);border-radius:var(--rl);padding:1.25rem;margin-bottom:1rem;color:#fff;position:relative;overflow:hidden}
.welcome-card::after{content:'⚽';position:absolute;right:-10px;bottom:-10px;font-size:80px;opacity:.08}
.welcome-card h3{font-size:18px;font-weight:700;margin-bottom:4px}
.welcome-card p{font-size:12px;opacity:.8;line-height:1.5}
.welcome-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:1rem}
.welcome-stat{background:rgba(255,255,255,.15);border-radius:var(--r);padding:8px;text-align:center}
.welcome-stat .n{font-size:20px;font-weight:700}
.welcome-stat .l{font-size:10px;opacity:.8}

/* ── Countdown ── */
.countdown-bar{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:.85rem 1rem;margin-bottom:1rem;display:flex;align-items:center;gap:12px}
.cd-icon{font-size:22px}
.cd-text{flex:1}
.cd-text strong{font-size:13px;display:block;margin-bottom:2px}
.cd-text span{font-size:12px;color:var(--text2)}
.cd-time{font-size:18px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}

/* ── Tabs ── */
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;margin-bottom:1.25rem;background:var(--bg);border-radius:var(--rl) var(--rl) 0 0}
.tab{padding:12px 16px;cursor:pointer;font-size:13px;color:var(--text2);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.tab.active{color:var(--red);border-bottom:2px solid var(--red);font-weight:600}

/* ── Cards ── */
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1rem}
.section-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin:.75rem 0 .5rem;display:flex;align-items:center;gap:6px}
.section-title::after{content:'';flex:1;height:0.5px;background:var(--border)}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;gap:4px}
.bs{background:var(--s-bg);color:var(--s-t)}
.bw{background:var(--w-bg);color:var(--w-t)}
.bi{background:var(--i-bg);color:var(--i-t)}
.bd{background:var(--d-bg);color:var(--d-t)}

/* ── Metrics ── */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.25rem}
.metric{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:1rem;text-align:center}
.metric .num{font-size:28px;font-weight:700;color:var(--red)}
.metric .lbl{font-size:11px;color:var(--text2);margin-bottom:4px}

/* ── Inputs ── */
input,select{width:100%;padding:9px 12px;border:0.5px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--bg);color:var(--text);height:38px}
input:focus,select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(26,58,107,.12)}
button{cursor:pointer;padding:8px 16px;border:0.5px solid var(--border2);border-radius:var(--r);background:transparent;color:var(--text);font-size:13px;transition:all .15s}
button:hover{background:var(--bg3)}
button.primary{background:var(--red);color:#fff;border-color:var(--red)}
button.primary:hover{opacity:.88}
button.secondary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-sm{padding:5px 10px;font-size:12px}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;font-weight:600;color:var(--text2);border-bottom:0.5px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
td{padding:9px 10px;border-bottom:0.5px solid var(--border)}
tr:last-child td{border-bottom:none}
hr{border:none;border-top:0.5px solid var(--border);margin:1.25rem 0}
.flex1{flex:1}
.muted{color:var(--text2);font-size:12px}

/* ── Avatar ── */
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--i-bg);color:var(--i-t);flex-shrink:0}

/* ── Match card big ── */
.match-card-big{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:10px;transition:box-shadow .2s}
.match-card-big:hover{box-shadow:0 2px 12px rgba(0,0,0,.08)}
.mcb-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mcb-teams{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.mcb-team{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.mcb-vs{font-size:11px;color:var(--text3);flex-shrink:0;background:var(--bg2);padding:2px 6px;border-radius:6px}
.match-times-block{display:flex;gap:0;margin-bottom:10px;border-radius:var(--r);overflow:hidden;border:0.5px solid var(--border)}
.match-times-block span{flex:1;font-size:11px;color:var(--text2);padding:5px 8px;background:var(--bg2);text-align:center;border-right:0.5px solid var(--border)}
.match-times-block span:last-child{border-right:none}
.match-times-block span em{display:block;font-style:normal;font-size:10px;color:var(--text3);margin-bottom:1px}
.mcb-scores{display:flex;flex-direction:column;gap:6px}
.mcb-score-row{display:flex;align-items:center;gap:10px;border-radius:var(--r);padding:9px 12px}
.pick-row{background:var(--w-bg);border-left:3px solid var(--w-t)}
.result-row{background:var(--s-bg);border-left:3px solid var(--s-t)}
.mcb-score-label{font-size:11px;font-weight:600;width:110px;flex-shrink:0;color:var(--text2)}
.mcb-score-val{font-size:16px;font-weight:700;flex:1;color:var(--text)}
.mcb-score-val.empty{font-size:13px;color:var(--text3);font-weight:400;font-style:italic}
.mcb-score-val.won{color:var(--s-t)}
.mcb-score-val.lost{color:var(--d-t)}
.locked-msg{font-size:11px;color:var(--d-t);background:var(--d-bg);padding:3px 8px;border-radius:20px;flex-shrink:0}
.ko-locked{font-size:11px;color:var(--text3);font-style:italic}

/* ── Group standings ── */
.gtable{width:100%;border-collapse:collapse;font-size:12px;margin-top:.5rem}
.gtable th{padding:5px 6px;font-size:10px;color:var(--text2);border-bottom:0.5px solid var(--border);font-weight:600;text-transform:uppercase}
.gtable td{padding:5px 6px;border-bottom:0.5px solid var(--border)}
.gtable tr:last-child td{border-bottom:none}
.qualify td:first-child{border-left:3px solid var(--s-t)}
.qualify{background:rgba(45,106,10,.06)}

/* ── Ranking ── */
.rank-row{display:flex;align-items:center;gap:10px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:12px 14px;margin-bottom:8px}
.rank-row.rank-1{border-color:#FFD700;background:linear-gradient(135deg,rgba(255,215,0,.
